name: 基金限购额度 · 每日抓取

# ⚠️ GitHub 的 cron 一律按 UTC 算，北京时间 = UTC + 8
#    01:35 UTC = 北京 09:35      13:30 UTC = 北京 21:30
on:
  schedule:
    - cron: "35 1 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:            # 也可以在 Actions 页面点一下立刻跑

permissions:
  contents: write               # 需要它才能把抓到的数据提交回仓库

# 同一时刻只允许一个抓取任务，避免两次运行互相覆盖
concurrency:
  group: fund-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai         # 让脚本里的「今天」按北京时间算

    steps:
      - name: 1. 取出仓库
        uses: actions/checkout@v4

      - name: 2. 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fund_tracker/requirements.txt

      - name: 3. 安装依赖
        run: pip install -r fund_tracker/requirements.txt

      - name: 4. 连通性自检（天天基金是否可达）
        continue-on-error: true
        run: |
          for url in \
            "http://fund.eastmoney.com/006075.html" \
            "http://fund.eastmoney.com/pingzhongdata/006075.js" \
            "https://api.fund.eastmoney.com/f10/lsjz?fundCode=006075&pageIndex=1&pageSize=1" \
          ; do
            code=$(curl -s -o /dev/null -m 25 -w '%{http_code}' --retry 2 \
                   -A 'Mozilla/5.0' -H 'Referer: http://fund.eastmoney.com/' "$url" || echo "ERR")
            echo "HTTP $code  <-  $url"
          done

      - name: 5. 抓取并落库
        id: fetch
        continue-on-error: true
        working-directory: fund_tracker
        run: |
          set -o pipefail
          python run_fetch.py 2>&1 | tee ../fetch.log

      - name: 6. 生成当日日报与归档目录
        working-directory: fund_tracker
        run: python make_report.py

      - name: 7. 发布到 docs/（GitHub Pages 的目录）
        run: |
          mkdir -p docs
          cp fund_tracker/report/index.html docs/index.html
          cp fund_tracker/report/latest.html docs/latest.html
          cp fund_tracker/report/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].html docs/ 2>/dev/null || true
          echo "docs/ 现有文件："
          ls -1 docs

      - name: 8. 把数据与日报提交回仓库
        run: |
          # SQLite 的 -wal / -shm 是运行时临时文件，先合并进主库再提交，
          # 否则新数据只留在 WAL 里，主库提交上去会缺数据
          python -c "import sqlite3,glob,os; p='fund_tracker/data/funds.db'; c=sqlite3.connect(p); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close(); [os.remove(f) for f in glob.glob(p+'-*')]" || true

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fund_tracker/data fund_tracker/report docs

          if git diff --cached --quiet; then
            echo "本次没有产生新的文件变化"
          else
            git commit -m "data: $(date +%Y-%m-%d) 额度快照"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            git push
          fi

      - name: 9. 写运行摘要
        if: always()
        run: |
          (cd fund_tracker && python ci_summary.py) | tee summary.md || true
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 10. 判定结果
        if: always()
        run: |
          echo "----- 抓取日志尾部 -----"
          tail -n 6 fetch.log 2>/dev/null || echo "(没有 fetch.log)"
          if grep -qE "成功 [1-9][0-9]* 只" fetch.log 2>/dev/null; then
            if [ "${{ steps.fetch.outcome }}" != "success" ]; then
              echo "::warning::个别基金抓取失败，成功的部分已保存，详见运行摘要"
            fi
          else
            echo "::error::本次没有任何数据落库，请检查上面的连通性自检与抓取日志"
            exit 1
          fi
